<!doctype html>
<html lang="ko">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <title>
            검색 경험의 확장과 정보구조 재설계 — 장대환 / SKUNKWORKS STUDIO
        </title>
        <link
            rel="icon"
            type="image/png"
            href="assets/logo_squared_favico.png"
        />
        <link rel="preconnect" href="https://cdn.jsdelivr.net" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css"
        />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="deck" id="deck">
            <!-- slides loaded by deck.js -->
        </div>

        <div class="slide-nav" id="nav"></div>

        <div class="rotate-hint" id="rotateHint">
            <div class="rotate-hint__deck">
                <p class="rotate-hint__eyebrow">
                    제14회 대한민국 기록전문가 포럼
                </p>
                <p class="rotate-hint__deck-title">
                    검색 경험의 확장과 정보구조 재설계
                </p>
                <p class="rotate-hint__deck-sub">
                    서울연구데이터서비스 AI 검색 구축 사례
                </p>
                <p class="rotate-hint__presenter">
                    장대환 · 스컹크웍스스튜디오
                </p>
            </div>
            <div class="rotate-hint__cta">
                <div class="rotate-hint__icon" aria-hidden="true">⟳</div>
                <p class="rotate-hint__title">화면을 가로로 돌려주세요</p>
                <p class="rotate-hint__desc">
                    발표 화면과 같은 비율로 보시려면<br />
                    기기를 가로 방향으로 회전하세요.
                </p>
            </div>
        </div>

        <script src="deck.js"></script>
    </body>
</html>
